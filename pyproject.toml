[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-document-ms"
version = "0.1.0"
description = "Microservice for deterministic income tax bracket ingestion from PDF documents."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
ingest-tax-documents = "app.commands.ingest_documents:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not openai_integration'"
markers = [
    "openai_integration: tests that call OpenAI and require OPENAI_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008", "UP007", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
